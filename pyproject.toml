[project]
name = "cub"
version = "0.1.0"
description = "Responsive Telegram assistant that delegates heavy tasks to local Claude Code CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Contributors" }
]
dependencies = [
  "python-telegram-bot[socks]>=22.0,<23.0",
  "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
cub-bot = "cub.main:main"
cta-bot = "cub.main:main"
cub-reset = "cub.state_reset:entrypoint"
cub-killall = "cub.killall:entrypoint"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cub"]

[tool.hatch.build.targets.sdist]
include = [
  "src/cub",
  "tests",
  "README.md",
  "CONTRIBUTING.md",
  "LICENSE",
  ".env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
